<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>木製プロペラ長距離飛行</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='14' y='2' width='4' height='28' rx='2' fill='%238b5a2b'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23c9433a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- 飛行中の画面は1画面に収める：上の帯／景色（残りの高さ全部）／計器盤（横1段） -->
    <div id="app">
      <header class="topbar">
        <div class="route" id="route"></div>
        <div class="clock">
          <strong id="day">1日目</strong>
          <span class="label">時刻</span> <strong id="clock">9:00</strong>
          <span class="label">日没</span> <span id="sunset">17:30</span>
        </div>
        <div class="buttons">
          <button id="view" title="視点を切り替える（V）">視点：後ろ</button>
          <button id="sound" title="エンジン音などのオン／オフ">音：オン</button>
          <button id="pause" title="一時停止（スペース）">一時停止</button>
          <span class="speed" role="group" aria-label="時間の速さ">
            <button data-speed="1" class="on">×1</button>
            <button data-speed="2">×2</button>
            <button data-speed="4">×4</button>
          </span>
          <label class="toggle"><input type="checkbox" id="details" /> 数値</label>
        </div>
      </header>

      <div class="view">
        <div class="stage">
          <canvas id="scene3d"></canvas>
          <canvas id="scene" hidden></canvas>
          <div class="hud"><span id="hud-wind"></span><span id="hud-alt"></span><span id="hud-oat"></span></div>

          <!-- 飛行メモ（景色の右上に重ねる） -->
          <div class="kneeboard">
            <div class="clip"></div>
            <div class="kb-title" id="kb-title"></div>
            <dl>
              <div class="kb-row" id="kb-ground"><dt>対地速度</dt><dd><span class="v"></span><span class="note"></span></dd></div>
              <div class="kb-row" id="kb-range"><dt>届く距離</dt><dd><span class="v"></span><span class="note"></span></dd></div>
              <div class="kb-row" id="kb-eta"><dt>到着予定</dt><dd><span class="v"></span><span class="note"></span></dd></div>
              <div class="kb-row" id="kb-ahead"><dt>前方の天気</dt><dd><span class="v"></span><span class="note"></span></dd></div>
            </dl>
          </div>

          <!-- お知らせと整備士のひとこと（景色の下に字幕のように重ねる） -->
          <div class="stage-bottom">
            <div class="toast" id="toast" hidden></div>
            <p class="mechanic"><span class="who">整備士</span><span id="advice"></span></p>
          </div>
        </div>
        <canvas id="routebar"></canvas>
      </div>

      <section class="cockpit" id="panel">
        <div class="gauges">
          <canvas class="gauge" id="g-asi" data-param="ASI" title="クリックで整備士のひとこと"></canvas>
          <canvas class="gauge" id="g-alt" data-param="ALT" title="クリックで整備士のひとこと"></canvas>
          <canvas class="gauge" id="g-tach" data-param="C1" title="クリックで整備士のひとこと"></canvas>
          <canvas class="gauge" id="g-egt" data-param="EGT" title="クリックで整備士のひとこと"></canvas>
          <canvas class="gauge" id="g-fuel" data-param="FUEL" title="クリックで整備士のひとこと"></canvas>
          <canvas class="gauge" id="g-engine" data-param="B4" title="クリックで整備士のひとこと"></canvas>
        </div>

        <div class="quadrant">
          <label class="lever throttle" title="W / S">
            <span class="end">全開</span>
            <span class="slot"><input type="range" id="throttle" min="20" max="100" step="1" /></span>
            <span class="end">絞る</span>
            <span class="lever-name" data-param="C1" title="クリックで整備士のひとこと">スロットル</span>
            <output id="throttle-out"></output>
          </label>
          <label class="lever mixture" title="A / D">
            <span class="end">濃い</span>
            <span class="slot"><input type="range" id="mixture" min="0" max="100" step="1" /></span>
            <span class="end">薄い</span>
            <span class="lever-name" data-param="C2" title="クリックで整備士のひとこと">ミクスチャー</span>
            <output id="mixture-out"></output>
          </label>
        </div>

        <div class="side">
          <div class="nav">
            <div class="navbox">
              <span class="nav-name" data-param="C4" title="クリックで整備士のひとこと">高度</span>
              <button data-nav="alt-down" title="F">▼</button>
              <output id="alt-target"></output>
              <button data-nav="alt-up" title="R">▲</button>
            </div>
            <div class="navbox">
              <span class="nav-name" data-param="COURSE" title="クリックで整備士のひとこと">よける</span>
              <button data-nav="left" title="Q">◀</button>
              <output id="course"></output>
              <button data-nav="right" title="E">▶</button>
            </div>
          </div>
          <div class="nav">
            <button class="switch" id="carbheat" data-nav="carb" title="H"><span class="knob"></span><span>キャブヒート<small id="carb-note">H</small></span></button>
            <button class="navbtn" id="radio" data-nav="radio" title="P"><span>気象ラジオ<small id="radio-note">P</small></span></button>
            <button class="navbtn warn" id="turnback" data-nav="turn" title="U"><span>引き返す<small>U</small></span></button>
          </div>

          <div class="annunciators" aria-label="警告灯">
            <span class="lamp red" id="lamp-rough">エンジン荒れ</span>
            <span class="lamp amber" id="lamp-fuel">燃料少</span>
            <span class="lamp red" id="lamp-rpm">回転超過</span>
            <span class="lamp amber" id="lamp-vib" data-param="B3" title="クリックで整備士のひとこと">振動</span>
            <span class="lamp amber" id="lamp-bolt" data-param="B1" title="クリックで整備士のひとこと" hidden>ボルト点検</span>
            <span class="lamp amber" id="lamp-carb" data-param="C3" title="クリックで整備士のひとこと" hidden>キャブ凍結</span>
          </div>

          <div class="pilot" aria-label="操縦者">
            <div class="pmeter" id="pilot-fatigue"><span class="pm-name" data-param="E1" title="クリックで整備士のひとこと">疲労</span><span class="st-bar"><i></i></span><span class="pm-word"></span></div>
            <div class="pmeter" id="pilot-haste"><span class="pm-name" data-param="E2" title="クリックで整備士のひとこと">焦り</span><span class="st-bar"><i></i></span><span class="pm-word"></span></div>
          </div>
        </div>
      </section>

      <div class="overlay" id="overlay" hidden>
        <div class="dialog" id="dialog"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
